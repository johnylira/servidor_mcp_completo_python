services:
  mcp-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-rag
    env_file:
      - .env
    ports:
      # Endpoint MCP via Server-Sent Events.
      - "8000:8000"
    volumes:
      # Mantém o índice ChromaDB após recriações do contêiner.
      - rag_data:/data
      # Disponibiliza documentos locais, em modo somente leitura (pdf, md e txt).
      - ./docs:/workspace/docs:ro
    restart: unless-stopped

volumes:
  rag_data:
